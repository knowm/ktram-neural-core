[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ktram-neural-core"
version = "0.0.1"
description = "Open emulator of kT-RAM realized as a 2-1 neural lane (unit crossbars, differential pairs, AAT selection)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Knowm Inc." }]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
examples = ["matplotlib>=3.5", "scikit-learn>=1.0"]
dev = ["pytest>=7"]
# Intel-mac wheels stop at torch 2.2.2 (built against numpy 1.x); numpy 2 there breaks
# torch.from_numpy with "Numpy is not available", so pin numpy below 2 on that platform.
torch = ["torch>=2.0",
         "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ktram_neural_core*"]
